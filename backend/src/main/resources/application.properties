server.address=127.0.0.1
server.port=${FL_API_PORT:8080}
server.error.include-message=never
spring.datasource.url=${FL_DB_URL:jdbc:mysql://127.0.0.1:3306/federated_hospitals}
spring.datasource.username=${FL_DB_USER:federated_app}
spring.datasource.password=${FL_DB_PASSWORD:}
spring.sql.init.mode=always
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.default-property-inclusion=non_null
fl.engine-directory=${FL_ENGINE_DIR:../ml-engine}
fl.python=${FL_PYTHON:../.venv/Scripts/python.exe}
fl.job-timeout-seconds=${FL_JOB_TIMEOUT_SECONDS:600}
fl.poll-delay-ms=500
